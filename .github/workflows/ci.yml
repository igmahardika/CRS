name: CI Pipeline

on:
  push:
    branches: [main, master, 'audit/*']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          AUTH_SECRET: 'ci-temporary-dummy-secret-value-32-chars-long'

      - name: Run Smoke Verification
        run: npm run test:smoke
        env:
          AUTH_SECRET: 'ci-temporary-dummy-secret-value-32-chars-long'

      - name: Audit Dependencies for Critical Vulnerabilities
        run: npm audit --audit-level=critical
